<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pigment — Upload</title><link rel="stylesheet" href="/style.css"></head>
<body>
<header class="toolbar"><nav class="page-nav" aria-label="Generator mode"><a href="/">Still</a><a href="/upload" aria-current="page">Upload</a><a href="/layered">Layered</a></nav></header>
<main>
<section class="workspace" aria-label="Canvas workspace">
<div class="canvas-stage"><div class="art-frame">
<canvas id="painting" width="1280" height="800" aria-label="Oil painting of your uploaded image" hidden></canvas>
<div id="empty-state"><p>Upload an image to begin.</p></div>
<div id="loading" hidden><span class="spinner" aria-hidden="true"></span><span id="progress">Preparing canvas…</span></div>
</div></div>
<div class="export-bar" aria-label="Export controls"><span id="output-size">3840 px longest edge</span><div class="export-actions"><button id="download" class="download" disabled>Export PNG</button></div></div>
<p id="status" role="status" aria-live="polite"></p>
</section>
<aside aria-label="Upload settings"><div class="panel-section"><h2>Source image</h2>
<label class="upload-drop" id="drop-zone" for="image-file"><strong>Choose an image</strong><span>or drop it here</span><span class="upload-formats">JPG, PNG, WebP · up to 20 MB</span><input id="image-file" type="file" accept="image/jpeg,image/png,image/webp" aria-label="Upload an image to paint"></label>
<p id="file-name" class="file-note">No image selected</p></div>
<div id="source-preview" class="panel-section" hidden><div class="panel-heading"><h2>Original</h2><span id="source-size"></span></div><img id="original" alt="Your original image"></div>
<button id="generate" class="primary" disabled><span>Paint this image</span></button></aside>
</main>
<script type="module" src="/upload.js"></script>
</body></html>
