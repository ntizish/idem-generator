<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pigment — Layered</title><link rel="stylesheet" href="/style.css"></head>
<body data-motion="layered">
<header class="toolbar"><nav class="page-nav" aria-label="Generator mode"><a href="/">Still</a><a href="/upload">Upload</a><a href="/layered" aria-current="page">Layered</a></nav></header>
<main>
<section class="workspace" aria-label="Canvas workspace">
<div class="canvas-stage"><div class="art-frame">
<canvas id="painting" width="1280" height="800" aria-label="Generated abstract oil painting"></canvas>

<div id="loading"><span class="spinner" aria-hidden="true"></span><span id="progress">Preparing canvas…</span></div>
</div></div>
<div class="export-bar" aria-label="Export controls"><span id="output-size">1280 × 800 px</span><div class="export-actions"><button id="download" class="download" disabled>Export frame</button><button id="record" class="download" disabled>Record 12 seconds</button></div></div>
<p id="status" role="status" aria-live="polite"></p>
</section>
<aside aria-label="Layered settings"><div class="panel-section"><div class="panel-heading"><h2>Colors</h2><span id="color-count">5 colors</span></div>
<div id="colors"></div><button id="add" class="add">＋ Add a color</button></div>
<div class="panel-section"><h2>Palettes</h2><div class="presets" id="presets"></div></div>
<button id="generate" class="primary"><span>Generate</span></button>
<div class="panel-section playback"><h2>Playback</h2><button id="pause" class="secondary" disabled>Pause</button></div></aside>
</main>
<script type="module" src="/animation.js"></script>
</body></html>
